spring.application.name=delivery-ms-payment

# URL mercado pago
url.base.mercado-pago=https://api.mercadopago.com
url.base.orchestrator-payment=http://localhost:8083

# ===============================
# CONFIGURACAO DO BANCO DE DADOS
# ===============================
spring.datasource.url=jdbc:h2:mem:delivery_ms_payment_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

#spring.datasource.url=jdbc:mysql://localhost:3306/delivery_ms_payment_db?useSSL=false&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=delivery123
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACAO JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONFIGURACOES OPCIONAIS
# ===============================
# Log das queries SQL (opcional)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# CONFIGURACOES PARA PROMETHEUS
# ===============================
# Habilita todos os endpoints do Actuator (incluindo prometheus)
management.endpoints.web.exposure.include=*

# Define o caminho base dos endpoints do Actuator
management.endpoints.web.base-path=/actuator

# Porta do servidor (se quiser alterar)
server.port=8082

# Opcional: restringir apenas ao endpoint prometheus
# management.endpoints.web.exposure.include=prometheus

